<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} — Jad Haidar</title>
  <meta name="description" content="{% block description %}Web Programming portfolio for the GIN446 course at USEK.{% endblock %}">
  <meta name="author" content="Jad Haidar">
  <meta name="theme-color" content="#E7E6EA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,500&display=swap" rel="stylesheet">

  {# Tab icon. #}
  <link rel="icon" href="{{ static_url('favicon.png') }}">

  {# Preview card shown when the link is shared on WhatsApp, Slack, etc.
     og:image needs a full address, which _external=True gives us. #}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %} — Jad Haidar">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:image" content="{{ url_for('static', filename='img/mark.webp', _external=True) }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="{{ static_url('style.css') }}">

  {# A page can add its own <style> or <link> here. It comes AFTER the main
     stylesheet, so anything a page puts in this block wins. profile.html
     uses it to colour itself with the colour that was picked in the form. #}
  {% block head %}{% endblock %}
</head>
<body>

  <a class="skip" href="#main">Skip to content</a>

  {# The whole site sits inside one white "shell" card floating on a grey
     page. Inside it, a narrow rail runs down the left with the menu
     turned on its side. #}
  <div class="shell">

    <header class="rail">
      <a class="brand" href="{{ url_for('home') }}">
        <img class="brand-logo" src="{{ static_url('logo-white.png') }}"
             alt="" width="767" height="392">
        <span class="visually-hidden">Home — Web Programming portfolio, Jad Haidar</span>
      </a>

      {# Small screens: this opens the menu. The HTML popover attribute
         does the showing and hiding, so there is no JavaScript. #}
      <button class="menu-toggle" type="button" popovertarget="site-menu" aria-label="Menu">
        <span class="menu-icon" aria-hidden="true"></span>
      </button>

      {# The one and only menu on the site. It comes from MENU in app.py,
         and the page you are on gets aria-current="page". #}
      <nav class="site-nav" id="site-menu" popover aria-label="Main menu">
        <button class="menu-close" type="button" popovertarget="site-menu" popovertargetaction="hide" aria-label="Close menu">
          <span class="close-icon" aria-hidden="true"></span>
        </button>
        <ul>
          {% for endpoint, label in menu %}
            <li>
              <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>{{ label }}</a>
            </li>
          {% endfor %}
        </ul>
      </nav>

      {# Decorative: the course code turned on its side at the foot of the
         rail. aria-hidden because it only repeats the page title. #}
      <p class="rail-mark" aria-hidden="true">GIN446</p>
    </header>

    <div class="shell-body">
      <main id="main">
        {% block content %}{% endblock %}
      </main>

      <footer class="site-footer">
        <p class="footer-note">This website is created for educational purposes only, as part of the GIN446 - Web Programming course, School of Engineering, USEK. (Fall 2026-2027)</p>

        {# "#top" scrolls to the top of the document (HTML spec), no id needed. #}
        <a class="back-to-top" href="#top">Back to top</a>
      </footer>
    </div>

  </div>

</body>
</html>
